name: Pantavion Priority Product and Innovation Audit
on:
  workflow_dispatch:
  push:
    branches: [recovery/classified-ledger-20260823]
    paths:
      - scripts/pantavion-priority-products-innovation.cjs
      - .github/workflows/pantavion-priority-products-innovation.yml
      - data/recovery/canonical-ledger/indexes/modules/**
permissions:
  contents: write
concurrency:
  group: pantavion-priority-products-innovation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: recovery/classified-ledger-20260823
      - run: node scripts/pantavion-priority-products-innovation.cjs
      - name: Verify truth and safety invariants
        run: |
          node -e 'const x=require("./data/recovery/canonical-ledger/product-deep-dives/manifest.json"); if(x.modules.length!==5||x.totalRecords<=0||x.verifiedLive!==false||x.deleteAllowed!==false) throw Error("priority audit invariant failed")'
      - name: Commit product evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/recovery/canonical-ledger/product-deep-dives
          git diff --cached --quiet && exit 0
          git commit -m "data(recovery): map priority products and innovation evidence"
          for attempt in 1 2 3; do
            git pull --rebase origin recovery/classified-ledger-20260823 &&
            git push origin HEAD:recovery/classified-ledger-20260823 && exit 0
            sleep $((attempt * 5))
          done
          exit 1
