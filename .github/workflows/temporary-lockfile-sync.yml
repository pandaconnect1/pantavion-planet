name: temporary-lockfile-sync

on:
  push:
    branches:
      - feat/durable-execution-runtime

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/durable-execution-runtime
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile only
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Commit synchronized lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "pantavion-guardian-bot"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize package lock"
          git push origin HEAD:feat/durable-execution-runtime
