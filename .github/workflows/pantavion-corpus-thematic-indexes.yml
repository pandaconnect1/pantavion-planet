name: Pantavion Corpus Thematic Indexes

on:
  workflow_dispatch:
  push:
    branches:
      - recovery/classified-ledger-20260823
    paths:
      - scripts/pantavion-corpus-indexes.cjs
      - .github/workflows/pantavion-corpus-thematic-indexes.yml
      - data/recovery/canonical-ledger/corpus/**

permissions:
  contents: write

concurrency:
  group: pantavion-corpus-thematic-indexes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-verify-indexes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout complete recovery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: recovery/classified-ledger-20260823

      - name: Generate pointer-only thematic indexes
        run: node scripts/pantavion-corpus-indexes.cjs

      - name: Verify corpus, receipt and index invariants
        run: |
          node <<'NODE'
          const fs = require('fs');
          const corpus = JSON.parse(fs.readFileSync('data/recovery/canonical-ledger/corpus/manifest.json', 'utf8'));
          const receipt = JSON.parse(fs.readFileSync('data/recovery/canonical-ledger/corpus/MATERIALIZATION_RECEIPT.json', 'utf8'));
          const index = JSON.parse(fs.readFileSync('data/recovery/canonical-ledger/indexes/manifest.json', 'utf8'));
          const moduleTotal = index.modules.reduce((n, x) => n + x.totalRecords, 0);
          const stageTotal = index.implementationStages.reduce((n, x) => n + x.totalRecords, 0);
          const failures = [];
          if (!Number.isSafeInteger(receipt.totalRecords) || receipt.totalRecords <= 0) failures.push('invalid receipt total');
          if (receipt.totalRecords !== receipt.countedBatchRecords) failures.push('receipt counted-batch mismatch');
          if (corpus.totalRecords !== receipt.totalRecords) failures.push('corpus/receipt total mismatch');
          if (index.totalRecords !== receipt.totalRecords) failures.push('index/receipt total mismatch');
          if (moduleTotal !== receipt.totalRecords) failures.push('module total mismatch');
          if (stageTotal !== receipt.totalRecords) failures.push('stage total mismatch');
          if (index.totalBatches !== receipt.totalBatches) failures.push('batch total mismatch');
          if (index.corpusFingerprint !== receipt.corpusFingerprint) failures.push('index/receipt fingerprint mismatch');
          if (corpus.corpusFingerprint !== receipt.corpusFingerprint) failures.push('corpus/receipt fingerprint mismatch');
          if (receipt.tested !== false || receipt.verified !== false || receipt.deleteAllowed !== false) failures.push('receipt safety flags changed');
          if (index.verifiedLive !== false) failures.push('verifiedLive must remain false');
          if (index.deleteAllowed !== false) failures.push('deleteAllowed must remain false');
          if (failures.length) throw new Error(failures.join('; '));
          console.log(JSON.stringify({
            totalRecords: receipt.totalRecords,
            moduleTotal,
            stageTotal,
            totalBatches: receipt.totalBatches,
            corpusFingerprint: receipt.corpusFingerprint,
            verifiedLive: index.verifiedLive,
            deleteAllowed: index.deleteAllowed
          }, null, 2));
          NODE

      - name: Commit generated indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/recovery/canonical-ledger/indexes
          if git diff --cached --quiet; then
            echo "Indexes are already current."
            exit 0
          fi
          git commit -m "data(recovery): materialize thematic corpus indexes"
          for attempt in 1 2 3; do
            if git pull --rebase origin recovery/classified-ledger-20260823 &&
               git push origin HEAD:recovery/classified-ledger-20260823; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying after rebase."
            sleep $((attempt * 5))
          done
          exit 1
