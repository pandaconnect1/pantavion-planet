name: Pantavion Owned AI Independent Provider Contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-owned-ai:
    name: Verify only Pantavion private model inference is allowed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify independent model provider contract
        run: node --no-warnings --experimental-strip-types tests/pantavion-owned-inference.test.mjs
