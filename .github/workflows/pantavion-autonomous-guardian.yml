name: Pantavion Autonomous Guardian

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write

jobs:
  autonomous-guardian:
    name: Autonomous Guardian Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Pantavion AI integrity audit
        run: node scripts/pantavion-ai-integrity-check.cjs

      - name: Pantavion Autonomous Guardian audit
        run: node scripts/pantavion-autonomous-guardian-audit.cjs

      - name: Build
        run: npm run build

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Open Guardian failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Pantavion Autonomous Guardian failure";
            const body = [
              "Pantavion Autonomous Guardian detected a failed audit/build/typecheck.",
              "",
              `Workflow: ${context.workflow}`,
              `Run ID: ${context.runId}`,
              `Commit: ${context.sha}`,
              `Branch: ${context.ref}`,
              "",
              "Guardian may detect, audit, report, and prepare work.",
              "Production mutation remains founder-gated."
            ].join("\n");

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "autonomous-guardian",
              per_page: 10
            });

            if (!existing.data.find((issue) => issue.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["autonomous-guardian", "pantavion-ai", "audit-failure"]
              });
            }
