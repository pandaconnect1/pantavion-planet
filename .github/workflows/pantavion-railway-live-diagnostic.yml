name: Pantavion Railway Live Diagnostic

on:
  push:
    branches:
      - diagnostic/railway-live-20260923
    paths:
      - ".github/workflows/pantavion-railway-live-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: DNS resolution
        shell: bash
        run: |
          set -euo pipefail
          for host in pantavion-planet-production.up.railway.app www.pantavion.com pantavion.com; do
            echo "===== DNS $host ====="
            getent ahosts "$host" || true
            nslookup "$host" || true
          done

      - name: HTTP probes
        shell: bash
        run: |
          set -euo pipefail
          origins=(
            "https://pantavion-planet-production.up.railway.app"
            "https://www.pantavion.com"
            "https://pantavion.com"
          )
          paths=(
            "/"
            "/api/pantavion/runtime/revision"
            "/api/social/health"
            "/api/pantavion/interpreter/health"
            "/professional/infrastructure/water/live"
          )

          for origin in "${origins[@]}"; do
            for path in "${paths[@]}"; do
              url="${origin}${path}"
              echo "===== $url ====="
              body="$(mktemp)"
              headers="$(mktemp)"
              code=$(curl -sS -L --connect-timeout 10 --max-time 25                 -D "$headers" -o "$body" -w "%{http_code}" "$url" || true)
              echo "HTTP=$code"
              echo "-- headers --"
              sed -n '1,40p' "$headers" || true
              echo "-- body first 800 bytes --"
              head -c 800 "$body" || true
              echo
              rm -f "$body" "$headers"
            done
          done
