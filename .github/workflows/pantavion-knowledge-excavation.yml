name: Pantavion Knowledge Excavation

on:
  pull_request:
    paths:
      - 'core/recovery/**'
      - 'scripts/pantavion-canonical-knowledge-excavation.cjs'
      - 'package.json'
      - '.github/workflows/pantavion-knowledge-excavation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  excavate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run canonical knowledge excavation
        run: npm run knowledge:excavate

      - name: Verify excavation outputs
        shell: bash
        run: |
          test -d data/recovery/canonical-knowledge
          test -f data/recovery/canonical-knowledge/corpus-manifest.json
          test -f data/recovery/canonical-knowledge/full-corpus.json
          test -f data/recovery/canonical-knowledge/batch-index.json
          test -f data/recovery/canonical-knowledge/batches/batch-a.json
          node <<'NODE'
          const fs = require('fs');
          const root = 'data/recovery/canonical-knowledge';
          const manifest = JSON.parse(fs.readFileSync(`${root}/corpus-manifest.json`, 'utf8'));
          const index = JSON.parse(fs.readFileSync(`${root}/batch-index.json`, 'utf8'));
          const batchA = JSON.parse(fs.readFileSync(`${root}/batches/batch-a.json`, 'utf8'));

          const total = Number(manifest.totalRecords ?? 0);
          if (!Number.isFinite(total) || total <= 0) {
            throw new Error(`Invalid total record count: ${total}`);
          }
          if (index.totalRecords !== total) {
            throw new Error(`Manifest/index total mismatch: ${total} != ${index.totalRecords}`);
          }
          if (index.corpusFingerprint !== manifest.corpusFingerprint) {
            throw new Error('Corpus fingerprint mismatch between manifest and batch index');
          }
          const batches = Array.isArray(index.batches) ? index.batches : [];
          if (!batches.length) throw new Error('No deterministic batches emitted');
          if (index.totalBatches !== batches.length) {
            throw new Error(`Batch count mismatch: ${index.totalBatches} != ${batches.length}`);
          }

          const a = batchA.checkpoint;
          const records = Array.isArray(batchA.records) ? batchA.records : [];
          const count = Number(a?.recordCount ?? 0);
          if (!a || a.batchLabel !== 'A') throw new Error('Batch A checkpoint missing or mislabeled');
          if (!Number.isFinite(count) || count <= 0 || count > 1499) {
            throw new Error(`Invalid Batch A count: ${count}`);
          }
          if (records.length !== count) {
            throw new Error(`Batch A record/checkpoint mismatch: ${records.length} != ${count}`);
          }
          if (a.startOrdinal !== 1 || a.endOrdinal !== count) {
            throw new Error(`Unexpected Batch A boundaries: ${a.startOrdinal}-${a.endOrdinal}`);
          }
          if (a.corpusFingerprint !== manifest.corpusFingerprint) {
            throw new Error('Batch A fingerprint mismatch');
          }
          if (records.some((record) => record.reviewStatus !== 'UNCLASSIFIED')) {
            throw new Error('Excavation must not silently pre-classify records');
          }

          const accounted = batches.reduce((sum, batch) => sum + Number(batch.recordCount || 0), 0);
          if (accounted !== total) {
            throw new Error(`Batch accounting mismatch: ${accounted} != ${total}`);
          }

          console.log(JSON.stringify({
            totalRecords: total,
            batchCount: batches.length,
            batchA: {
              startOrdinal: a.startOrdinal,
              endOrdinal: a.endOrdinal,
              recordCount: count,
            },
            corpusFingerprint: manifest.corpusFingerprint,
            accountedRecords: accounted,
          }, null, 2));
          NODE

      - name: Upload excavation artifact
        uses: actions/upload-artifact@v4
        with:
          name: pantavion-canonical-knowledge-excavation
          path: data/recovery/canonical-knowledge
          if-no-files-found: error
          retention-days: 14
