name: Pantavion Recovery Partition Executor

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pantavion-recovery-partition-executor.yml"
      - "scripts/pantavion-github-recovery-partition-executor.mjs"
      - "scripts/pantavion-github-recovery-stage-executor.mjs"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: pantavion-recovery-partition-executor
  cancel-in-progress: false

jobs:
  execute-recovery-pipeline:
    name: Execute fenced recovery pipeline to terminal
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate deterministic recovery source index
        run: node scripts/pantavion-recovery-source-batch-index.mjs

      - name: Verify source index contract
        run: node scripts/pantavion-recovery-source-batch-index-test.mjs

      - name: Execute recovery partitions through GitHub OIDC fencing bridge
        run: node --no-warnings --experimental-strip-types scripts/pantavion-github-recovery-partition-executor.mjs

      - name: Rebuild semantic truth for all 82,413 records
        run: node scripts/pantavion-canonical-semantic-classification-v3.cjs

      - name: Verify fail-closed recovery runtime contract
        run: npm run test:recovery-runtime-fabric

      - name: Materialize all 82,413 deterministic recovery work units
        run: npm run materialize:recovery-runtime-fabric

      - name: Execute classify → canonicalize → route → audit → work-unit stages
        env:
          PANTAVION_RECOVERY_STAGE_CONCURRENCY: "16"
        run: node scripts/pantavion-github-recovery-stage-executor.mjs
