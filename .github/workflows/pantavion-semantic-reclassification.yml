name: Pantavion Semantic Reclassification
on:
  workflow_dispatch:
  push:
    branches: [recovery/classified-ledger-20260823]
    paths:
      - scripts/pantavion-semantic-reclassification.cjs
      - .github/workflows/pantavion-semantic-reclassification.yml
      - data/recovery/canonical-ledger/corpus/batches/**
permissions:
  contents: write
concurrency:
  group: pantavion-semantic-reclassification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: recovery/classified-ledger-20260823
      - run: node scripts/pantavion-semantic-reclassification.cjs
      - name: Verify non-mutating safety invariants
        run: |
          node -e 'const x=require("./data/recovery/canonical-ledger/semantic-reclassification/manifest.json"); if(x.unclassifiedInput!==1289||x.corpusMutated!==false||x.verifiedLive!==false||x.deleteAllowed!==false) throw Error("semantic reclassification invariant failed")'
      - name: Commit suggestions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/recovery/canonical-ledger/semantic-reclassification
          git diff --cached --quiet && exit 0
          git commit -m "data(recovery): analyze unclassified and Dating records"
          for attempt in 1 2 3; do
            git pull --rebase origin recovery/classified-ledger-20260823 &&
            git push origin HEAD:recovery/classified-ledger-20260823 && exit 0
            sleep $((attempt * 5))
          done
          exit 1
