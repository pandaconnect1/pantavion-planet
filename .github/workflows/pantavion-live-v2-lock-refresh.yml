name: Pantavion Live V2 Deliberate Water Lock Refresh

on:
  push:
    branches:
      - release/pantavion-live-20260923-v2
    paths:
      - ".github/workflows/pantavion-live-v2-lock-refresh.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pantavion-live-v2-lock-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact release branch
        uses: actions/checkout@v4
        with:
          ref: release/pantavion-live-20260923-v2
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deliberately refresh Water runtime lock
        env:
          PANTAVION_WATER_LOCK_REFRESH: "YES"
          PANTAVION_WATER_LOCK_REFRESH_REASON: "Provider-neutral production verification: replace Vercel deployment-ID dependency with exact Railway/Git revision verification. No water source truth, geometry, access invariant or segmented-delivery invariant changes."
        run: node scripts/refresh-water-network-runtime-lock.cjs

      - name: Verify refreshed lock immediately
        run: node scripts/pantavion-water-network-runtime-lock.cjs

      - name: Commit refreshed lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "pantavion-release-bot"
          git config user.email "pantavion-release-bot@users.noreply.github.com"
          git add core/infrastructure/water/water-network-runtime-lock.json
          if git diff --cached --quiet; then
            echo "No lock change required."
            exit 0
          fi
          git commit -m "water: deliberately refresh lock for provider-neutral verifier"
          git push origin HEAD:release/pantavion-live-20260923-v2
