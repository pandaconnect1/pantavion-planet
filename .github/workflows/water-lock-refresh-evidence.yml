name: Water Lock Refresh Evidence

'on':
  push:
    branches:
      - fix/water-lock-refresh-evidence
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deliberate-refresh:
    if: github.event.head_commit.message != 'chore: refresh water network runtime lock'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: fix/water-lock-refresh-20260926
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh protected hashes without changing invariants
        env:
          PANTAVION_WATER_LOCK_REFRESH: "YES"
          PANTAVION_WATER_LOCK_REFRESH_REASON: "Refresh integrity hashes after reviewed water admin/session, bbox segment, admin access, and controlled segment client changes; source truth and privacy invariants remain unchanged."
        run: node scripts/refresh-water-network-runtime-lock.cjs
      - name: Verify refreshed lock
        run: npm run audit:water:network-lock
      - name: Commit refreshed manifest only
        run: |
          set -euo pipefail
          git config user.name "pantavion-water-lock-bot"
          git config user.email "actions@users.noreply.github.com"
          git add core/infrastructure/water/water-network-runtime-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh water network runtime lock"
          git push origin HEAD:fix/water-lock-refresh-20260926
