name: Water Topology Readiness Gate
on:
  pull_request:
    paths:
      - "scripts/water-topology-readiness-gate.cjs"
      - ".github/workflows/water-topology-readiness-gate.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  topology-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test topology safety gate (no production access)
        run: node scripts/water-topology-readiness-gate.cjs --self-test
