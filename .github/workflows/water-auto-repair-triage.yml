name: Pantavion Water Automated Repair Triage
on:
  schedule:
    - cron: "43 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: water-auto-repair-triage
  cancel-in-progress: false
jobs:
  detect-and-triage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check immutable water network (read-only)
        id: network
        continue-on-error: true
        run: npm run audit:water:network-lock
      - name: Check private segment regression (read-only)
        id: segment
        continue-on-error: true
        run: node --experimental-strip-types scripts/water-segment-reader-regression.mjs
      - name: Deduplicate and update one actionable failure issue
        if: steps.network.outcome == 'failure' || steps.segment.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          NETWORK: ${{ steps.network.outcome }}
          SEGMENT: ${{ steps.segment.outcome }}
        with:
          script: |
            const title = '[P0][Water] Automated safety gate failure — repair required';
            const body = [
              'Automated detection, NOT an automated production repair.',
              'Network lock: ' + process.env.NETWORK,
              'Private segment regression: ' + process.env.SEGMENT,
              'Evidence: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              'Required: investigate, patch on branch, test, review, deploy with approval and verify live.',
              'Do not modify authentic GIS, topology, permissions, or production automatically.'
            ].join('\n\n');
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100
            });
            const issue = existing.find(i => !i.pull_request && i.title === title);
            if (issue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body
              });
            }
      - name: Fail when safety checks fail
        if: steps.network.outcome == 'failure' || steps.segment.outcome == 'failure'
        run: exit 1
