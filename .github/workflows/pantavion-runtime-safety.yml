name: Pantavion Runtime Safety

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-safety:
    name: Audit, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify founder-only Kernel API surface
        run: node scripts/pantavion-kernel-founder-access-gate.cjs

      - name: Verify Pantavion-native canonical state and execution intake
        run: node scripts/pantavion-canonical-state-runtime-gate.cjs

      - name: Verify conversation intake truth contract
        run: node --no-warnings --experimental-strip-types scripts/pantavion-conversation-intake-contract-test.mjs

      - name: Verify universal artifact intake contract
        run: node --no-warnings --experimental-strip-types scripts/pantavion-universal-artifact-intake-contract-test.mjs

      - name: Verify universal artifact upload contract
        run: node scripts/pantavion-universal-artifact-upload-contract-test.mjs

      - name: Verify self-sustaining sovereignty loop
        run: node --no-warnings --experimental-strip-types scripts/pantavion-sovereignty-loop-test.mjs

      - name: Verify translation worker contract
        run: node scripts/pantavion-translation-worker-gate.cjs

      - name: Verify translation runtime architecture
        run: npm run audit:translation-runtime

      - name: Verify translation gateway resilience contract
        run: node --no-warnings --experimental-strip-types scripts/pantavion-translation-gateway-resilience-test.mjs

      - name: Verify translation gateway rate-limit circuit
        run: node --no-warnings --experimental-strip-types scripts/pantavion-translation-rate-limit-circuit-test.mjs

      - name: Verify translation provider credential isolation
        run: node --no-warnings --experimental-strip-types scripts/pantavion-translation-provider-credential-test.mjs

      - name: Verify water network lock
        run: npm run audit:water:network-lock

      - name: Verify implementation evidence
        run: npm run audit:implementation

      - name: Verify secure scheduled worker
        run: npm run audit:scheduled-worker

      - name: Verify real implementation gate
        run: node scripts/pantavion-vscode-real-implementation-gate.cjs

      - name: Typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck 2>&1 | tee typecheck.log
          status=${PIPESTATUS[0]}
          if [ "${status}" -ne 0 ]; then
            head -n 20 typecheck.log | sed 's/%/%25/g' | while IFS= read -r line; do
              echo "::error title=TypeScript compiler::${line}"
            done
            exit "${status}"
          fi

      - name: Production build
        run: npm run build
