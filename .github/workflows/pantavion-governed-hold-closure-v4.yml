name: Pantavion Governed HOLD Closure v4

on:
  pull_request:
    paths:
      - "data/recovery/governed-hold-resolution-v4.json"
      - "scripts/pantavion-semantic-v4-governed-hold-test.cjs"
      - "scripts/pantavion-canonical-semantic-classification-v3.cjs"
      - "scripts/pantavion-semantic-v3-strict-anchor-contract-test.cjs"
      - ".github/workflows/pantavion-governed-hold-closure-v4.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pantavion-governed-hold-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governed-hold-closure:
    name: Govern every current semantic HOLD
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify current production migration provenance
        run: |
          node scripts/verify-supabase-production-history.mjs
          ALLOW_FORWARD_MIGRATIONS=1 node scripts/audit-supabase-migration-drift.mjs

      - name: Verify strict semantic ownership contracts
        run: node scripts/pantavion-semantic-v3-strict-anchor-contract-test.cjs

      - name: Rebuild current semantic ledger from immutable corpus
        run: node scripts/pantavion-canonical-semantic-classification-v3.cjs

      - name: Require governed disposition for every HOLD
        run: node scripts/pantavion-semantic-v4-governed-hold-test.cjs

      - name: Upload governed recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: pantavion-governed-hold-closure-v4
          path: |
            data/recovery/canonical-semantic-v3/manifest.json
            data/recovery/canonical-semantic-v3/module-gap-map.json
            data/recovery/canonical-semantic-v3/governed-hold-closure.json
          retention-days: 30
