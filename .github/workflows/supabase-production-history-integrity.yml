name: Supabase Production History Integrity

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/production-history-baseline.json'
      - 'supabase/production-migration-index.json'
      - 'scripts/verify-supabase-production-history.mjs'
      - 'scripts/audit-supabase-migration-drift.mjs'
      - '.github/workflows/supabase-production-history-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/production-history-baseline.json'
      - 'supabase/production-migration-index.json'
      - 'scripts/verify-supabase-production-history.mjs'
      - 'scripts/audit-supabase-migration-drift.mjs'
      - '.github/workflows/supabase-production-history-integrity.yml'

permissions:
  contents: read

jobs:
  verify-production-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify canonical production migration provenance
        run: node scripts/verify-supabase-production-history.mjs
      - name: Audit production/local migration drift
        run: node scripts/audit-supabase-migration-drift.mjs
