name: Pantavion Global Innovation Portfolio
on:
  workflow_dispatch:
  push:
    branches: [recovery/classified-ledger-20260823]
    paths:
      - scripts/pantavion-global-innovation-portfolio.cjs
      - .github/workflows/pantavion-global-innovation-portfolio.yml
      - data/recovery/canonical-ledger/indexes/modules/**
permissions:
  contents: write
concurrency:
  group: pantavion-global-innovation-portfolio-${{ github.ref }}
  cancel-in-progress: false
jobs:
  portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: recovery/classified-ledger-20260823
      - run: node scripts/pantavion-global-innovation-portfolio.cjs
      - name: Verify portfolio invariants
        run: |
          node -e 'const x=require("./data/recovery/canonical-ledger/innovation-portfolio/manifest.json"); if(x.corpusRecords!==82413||x.verifiedClaims!==0||x.verifiedLive!==false||x.deleteAllowed!==false) throw Error("innovation portfolio invariant failed")'
      - name: Commit portfolio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/recovery/canonical-ledger/innovation-portfolio
          git diff --cached --quiet && exit 0
          git commit -m "data(recovery): build global innovation grant portfolio"
          for attempt in 1 2 3; do
            git pull --rebase origin recovery/classified-ledger-20260823 &&
            git push origin HEAD:recovery/classified-ledger-20260823 && exit 0
            sleep $((attempt * 5))
          done
          exit 1
