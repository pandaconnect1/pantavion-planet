name: Pantavion Water B Native CAD Probe
on:
  push:
    branches: [diagnostics/water-b-native-libredwg-20261014]
    paths:
      - ".github/workflows/pantavion-water-b-native-probe.yml"
      - "scripts/water-native-b-parse-diagnostic.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-dwg-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install application dependencies
        run: npm ci --no-audit --no-fund
      - name: Build native upstream LibreDWG CLI on an isolated ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential             autoconf automake libtool pkg-config texinfo help2man             libiconv-hook-dev python3 swig git
          git clone --depth 1 https://github.com/LibreDWG/libredwg.git /tmp/water-native-libredwg
          cd /tmp/water-native-libredwg
          ./autogen.sh
          ./configure --disable-bindings --disable-docs --disable-shared
          make -j2
          sudo make install
          sudo ldconfig
          command -v dwgread
          dwgread --version
      - name: Resolve project-specific secret at runtime without logging it
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Run private B CAD probe without publishing or saving raw DWG
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test "$SUPABASE_PROJECT_REF" = "cxhulvwkagzufbjsdwwu"
          keyfile="$RUNNER_TEMP/native-water-b-key"
          trap 'rm -f "$keyfile"' EXIT
          umask 077
          supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" --output json |
            jq -r '[.[] | select((.type == "secret") or (.name == "service_role")) | .api_key][0] // empty' > "$keyfile"
          export SUPABASE_SECRET_KEY="$(cat "$keyfile")"
          test "${#SUPABASE_SECRET_KEY}" -ge 32
          echo "::add-mask::$SUPABASE_SECRET_KEY"
          node scripts/water-native-b-parse-diagnostic.mjs
