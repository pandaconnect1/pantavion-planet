name: Pantavion Innovation Semantic Overlap Review

on:
  pull_request:
    branches:
      - feature/innovation-capability-mapping-20260910
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-semantic-overlap-review:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR head revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate and verify full innovation review chain
        run: npm run innovations:verify-overlaps

      - name: Preserve first deterministic review queue
        run: cp -R data/recovery/innovation-semantic-overlap-review /tmp/innovation-semantic-overlap-review-first

      - name: Regenerate and reverify review queue
        run: npm run innovations:find-overlaps && npm run audit:innovation-overlaps

      - name: Require byte-identical deterministic regeneration
        run: diff -ru /tmp/innovation-semantic-overlap-review-first data/recovery/innovation-semantic-overlap-review

      - name: Upload exact-head overlap evidence
        uses: actions/upload-artifact@v4
        with:
          name: pantavion-innovation-semantic-overlap-review-${{ github.event.pull_request.head.sha || github.sha }}
          path: data/recovery/innovation-semantic-overlap-review
          if-no-files-found: error
          retention-days: 30
