name: Pantavion Water Cyprus Release Gate

on:
  push:
    branches:
      - release/pantavion-water-live-20260923
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Cyprus federation audit
        run: node scripts/pantavion-water-cyprus-federation-audit.mjs
      - name: Universal artifact intake contract
        run: node --no-warnings --experimental-strip-types scripts/pantavion-universal-artifact-intake-contract-test.mjs
      - name: Water network lock
        run: npm run audit:water:network-lock
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
