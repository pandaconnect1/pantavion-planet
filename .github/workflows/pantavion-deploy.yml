name: Pantavion CI — Render Production Checks

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

env:
  VERCEL_CLI_VERSION: "59.5.0"

concurrency:
  group: pantavion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Verify canonical Water vault upload origin policy
        run: node --no-warnings --experimental-strip-types scripts/water-vault-origin-regression.mjs

      - name: Verify founder-selected DWG private intake and review gates
        run: node --no-warnings --experimental-strip-types scripts/water-owner-selected-dwg-contract-test.mjs

      - name: Verify signed object PUT upload after TUS authentication failure
        run: node --no-warnings --experimental-strip-types scripts/water-owner-dwg-signed-put-test.mjs

      - name: Pantavion AI audit if present
        run: npm run audit:pantavion --if-present

      - name: Tests if present
        run: npm test --if-present

      - name: Verify approved owner B source integrity rules
        run: node scripts/water-approved-owner-source-regression.mjs

      - name: Verify Map B derived geometry generator
        run: npm run test:water-map-b-derived-generator

      - name: Verify founder-approved exact DWG ingestion and corruption rejection
        run: node scripts/water-approved-owner-dwg-regression.mjs

      - name: Verify owned AI origin and inference contract
        run: node --no-warnings --experimental-strip-types tests/pantavion-owned-inference.test.mjs

      - name: Build
        run: npm run build

