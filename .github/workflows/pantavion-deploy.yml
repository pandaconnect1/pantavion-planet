name: Pantavion CI + Deploy Spine

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

concurrency:
  group: pantavion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint if present
        run: npm run lint --if-present

      - name: Typecheck if present
        run: npm run typecheck --if-present

      - name: Pantavion AI audit if present
        run: npm run audit:pantavion --if-present

      - name: Tests if present
        run: npm test --if-present

      - name: Build
        run: npm run build

  production_schema:
    name: Apply Production Supabase Migrations
    needs: validate
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Supabase migration changes
        id: migrations
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          after="${{ github.sha }}"

          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "No reliable before SHA; fail-safe migration verification required."
            exit 0
          fi

          if git diff --name-only "$before" "$after" -- 'supabase/migrations/**' | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Supabase migration changes detected."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No Supabase migration changes detected; schema deployment is not required for this app-only release."
          fi

      - name: Require production Supabase credentials when migrations changed
        if: ${{ steps.migrations.outputs.changed == 'true' }}
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured. A real Supabase migration changed, so production schema deployment cannot be skipped."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Setup Supabase CLI
        if: ${{ steps.migrations.outputs.changed == 'true' }}
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link exact production project
        if: ${{ steps.migrations.outputs.changed == 'true' }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Preview pending migrations
        if: ${{ steps.migrations.outputs.changed == 'true' }}
        run: supabase db push --linked --dry-run

      - name: Apply pending migrations
        if: ${{ steps.migrations.outputs.changed == 'true' }}
        run: supabase db push --linked

      - name: Verify migration history
        if: ${{ steps.migrations.outputs.changed == 'true' }}
        run: supabase migration list --linked

      - name: Confirm schema gate not required
        if: ${{ steps.migrations.outputs.changed == 'false' }}
        run: echo "Schema gate passed: no Supabase migration changed in this release."

  deploy_preview_vercel:
    name: Optional Deploy Preview to Vercel
    needs: validate
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Skip Vercel preview if secrets are missing
        if: ${{ env.VERCEL_TOKEN == '' || env.VERCEL_ORG_ID == '' || env.VERCEL_PROJECT_ID == '' }}
        run: |
          echo "Skipping Vercel preview deploy because Vercel secrets are not configured."
          echo "The build is still validated. Vercel Git integration may deploy separately."

      - name: Checkout
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        uses: actions/checkout@v4

      - name: Setup Node
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: npm install --no-audit --no-fund

      - name: Install Vercel CLI
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: npm install --global vercel@latest

      - name: Pull Vercel preview env
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: vercel pull --yes --environment=preview --token=$VERCEL_TOKEN

      - name: Build preview
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: vercel build --token=$VERCEL_TOKEN

      - name: Deploy preview
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: vercel deploy --prebuilt --token=$VERCEL_TOKEN

  deploy_production:
    name: Deploy Production to Vercel + AWS
    needs:
      - validate
      - production_schema
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
    runs-on: ubuntu-latest

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
      AWS_CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Report Vercel deployment path
        if: ${{ env.VERCEL_TOKEN == '' || env.VERCEL_ORG_ID == '' || env.VERCEL_PROJECT_ID == '' }}
        run: |
          echo "Vercel CLI secrets are not configured in GitHub Actions."
          echo "No CLI production deploy will be claimed by this workflow; Vercel Git integration may still deploy separately."

      - name: Checkout
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        uses: actions/checkout@v4

      - name: Setup Node
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: npm install --no-audit --no-fund

      - name: Install Vercel CLI
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: npm install --global vercel@latest

      - name: Pull Vercel production env
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build production
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy production
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

      - name: Configure AWS credentials optional
        if: ${{ env.AWS_ROLE_TO_ASSUME != '' && env.AWS_REGION != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Optional AWS sync
        if: ${{ env.AWS_REGION != '' && env.AWS_S3_BUCKET != '' }}
        run: |
          echo "Checking optional AWS deployment hooks..."

          if [ -n "$AWS_S3_BUCKET" ] && [ -d "./ops/aws-backbone" ]; then
            echo "Syncing ./ops/aws-backbone to s3://$AWS_S3_BUCKET"
            aws s3 sync ./ops/aws-backbone s3://$AWS_S3_BUCKET --delete
          else
            echo "Skipping S3 sync. Either bucket secret or ./ops/aws-backbone is missing."
          fi

          if [ -n "$AWS_CLOUDFRONT_DISTRIBUTION_ID" ]; then
            echo "Creating CloudFront invalidation..."
            aws cloudfront create-invalidation --distribution-id "$AWS_CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
          else
            echo "Skipping CloudFront invalidation."
          fi
