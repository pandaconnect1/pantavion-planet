name: Pantavion Innovation Semantic Atomization

on:
  pull_request:
    branches:
      - feature/innovation-master-register-20260909
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-semantic-atomization:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR head revision
        uses: actions/checkout@v4
        with:
          ref: \${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate and verify parent register plus semantic atoms
        run: npm run innovations:verify-atomization

      - name: Preserve first deterministic projection
        run: cp -R data/recovery/innovation-semantic-atomization /tmp/innovation-semantic-atomization-first

      - name: Regenerate and reverify semantic atoms
        run: npm run innovations:atomize && npm run audit:innovation-atomization

      - name: Require byte-identical deterministic regeneration
        run: diff -ru /tmp/innovation-semantic-atomization-first data/recovery/innovation-semantic-atomization

      - name: Upload exact-head atomization evidence
        uses: actions/upload-artifact@v4
        with:
          name: pantavion-innovation-semantic-atomization-${{ github.sha }}
          path: data/recovery/innovation-semantic-atomization
          if-no-files-found: error
          retention-days: 30
