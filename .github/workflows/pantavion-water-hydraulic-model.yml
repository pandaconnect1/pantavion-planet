name: Pantavion Water Hydraulic Model

# Builds the inputs of the hydraulic model of the network, step by step.
# Step 1: ground elevation of every node from the open Copernicus DEM.
on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        type: choice
        options: [elevation]
        default: elevation
  # A change to the elevation step re-samples (the workflow cannot be
  # dispatched before it exists on main).
  push:
    paths:
      - "scripts/pantavion-water-node-elevation.py"
      - ".github/workflows/pantavion-water-hydraulic-model.yml"

permissions:
  contents: read

concurrency:
  group: pantavion-water-hydraulic-model
  cancel-in-progress: false

jobs:
  model:
    name: Hydraulic model inputs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Require canonical Supabase project
        run: test "$SUPABASE_PROJECT_REF" = "cxhulvwkagzufbjsdwwu"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Resolve service key without logging it
        id: key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/pantavion-water-model-key"
          supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" --output json \
            | jq -r '[.[] | select((.type == "secret") or (.name == "service_role")) | .api_key][0] // empty' > "$key_file"
          test "$(wc -c < "$key_file")" -ge 32
          echo "::add-mask::$(cat "$key_file")"
          echo "key_file=$key_file" >> "$GITHUB_OUTPUT"

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --quiet rasterio numpy

      - name: Node elevations (Copernicus DEM GLO-30)
        if: ${{ github.event_name == 'push' || inputs.step == 'elevation' }}
        shell: bash
        env:
          KEY_FILE: ${{ steps.key.outputs.key_file }}
          SUPABASE_URL: https://cxhulvwkagzufbjsdwwu.supabase.co
        run: |
          set -euo pipefail
          export SUPABASE_SECRET_KEY="$(cat "$KEY_FILE")"
          python scripts/pantavion-water-node-elevation.py
          rm -f "$KEY_FILE"
