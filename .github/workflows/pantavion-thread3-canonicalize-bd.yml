name: Pantavion Thread 3 Canonicalize B D Buckets 5-9

on:
  push:
    branches:
      - backup/pre-vercel-risk-20260914
    paths:
      - "scripts/recovery/thread3-canonicalize-bd.mjs"
      - ".github/workflows/pantavion-thread3-canonicalize-bd.yml"
      - "docs/recovery/live/canonical/CANONICAL_SHARDING_CONTRACT_V1.json"
      - "docs/recovery/live/batches/lane-b-20260915T1356Z-incremental-dedupe.json"
      - "docs/recovery/live/shards/lane-d-legacy-b.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pantavion-thread3-canonicalize-bd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backup/pre-vercel-risk-20260914
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Canonicalize only Thread 3 B D buckets 5-9
        shell: bash
        run: |
          set -euo pipefail
          node scripts/recovery/thread3-canonicalize-bd.mjs | tee /tmp/thread3-canonicalize-bd-result.json
      - name: Commit durable B D canonical ledger writes
        shell: bash
        env:
          BRANCH: backup/pre-vercel-risk-20260914
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/recovery/live/canonical/thread3-bd-bucket-5.json \
            docs/recovery/live/canonical/thread3-bd-bucket-6.json \
            docs/recovery/live/canonical/thread3-bd-bucket-7.json \
            docs/recovery/live/canonical/thread3-bd-bucket-8.json \
            docs/recovery/live/canonical/thread3-bd-bucket-9.json \
            docs/recovery/live/canonical/thread3-bd-manifest.json \
            docs/recovery/live/shards/thread3-canonical-bd.json \
            docs/recovery/live/handoffs/thread3-to-thread4-bd.json
          if git diff --cached --quiet; then
            echo "Idempotent no-op: B/D canonical artifacts already match source evidence."
            exit 0
          fi
          git commit -m "recovery: canonicalize Thread 3 B D buckets 5-9"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
