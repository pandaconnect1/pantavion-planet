name: Water Lock Unauthorized Refresh Regression

on:
  pull_request:
    paths:
      - "scripts/pantavion-water-lock-refresh-denial-test.cjs"
      - "scripts/refresh-water-network-runtime-lock.cjs"
      - "core/infrastructure/water/water-network-runtime-lock.json"
      - ".github/workflows/water-lock-refresh-denial-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny-unauthorized-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reject unauthorized lock refresh without manifest mutation
        run: node scripts/pantavion-water-lock-refresh-denial-test.cjs
      - name: Verify Water Network Lock
        run: npm run audit:water:network-lock
