name: Pantavion Production Sync Verification

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: pantavion-production-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify_production_sync:
    name: Verify Production Code + Supabase Sync
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HEALTH_URL: https://pantavion.com/api/social/health
      EXPECTED_SHA: ${{ github.sha }}

    steps:
      - name: Wait for exact production revision and Social schema
        shell: bash
        run: |
          set -u

          echo "Expected production revision: $EXPECTED_SHA"
          echo "Health endpoint: $HEALTH_URL"

          for attempt in $(seq 1 40); do
            echo "Sync verification attempt $attempt/40"

            http_code=$(curl -sS -L --connect-timeout 10 --max-time 20 \
              -o /tmp/pantavion-social-health.json \
              -w "%{http_code}" \
              "$HEALTH_URL" || true)

            if [ -s /tmp/pantavion-social-health.json ]; then
              cat /tmp/pantavion-social-health.json
              echo
            fi

            if node <<'NODE'
const fs = require('fs');
const expected = process.env.EXPECTED_SHA;
let payload;
try {
  payload = JSON.parse(fs.readFileSync('/tmp/pantavion-social-health.json', 'utf8'));
} catch {
  process.exit(1);
}

const capabilities = Array.isArray(payload.capabilities) ? payload.capabilities : [];
const allReady = capabilities.length >= 6 && capabilities.every((item) => item && item.ready === true);
const exactRevision = payload.revision === expected;
const expectedSchema = payload.schema === 'social-20260811-v1';

if (payload.ok === true && allReady && exactRevision && expectedSchema) {
  console.log('Pantavion production code and Social Supabase schema are synchronized.');
  process.exit(0);
}

console.log(JSON.stringify({
  synchronized: false,
  expectedRevision: expected,
  observedRevision: payload.revision ?? null,
  expectedSchema: 'social-20260811-v1',
  observedSchema: payload.schema ?? null,
  capabilities,
}, null, 2));
process.exit(1);
NODE
            then
              echo "Production synchronization VERIFIED."
              exit 0
            fi

            if [ "$attempt" -lt 40 ]; then
              sleep 15
            fi
          done

          echo "::error::Pantavion production did not reach synchronized code + Supabase state within 10 minutes."
          exit 1
