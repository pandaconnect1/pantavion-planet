name: Pantavion Live Release V2 Gate

on:
  push:
    branches:
      - release/pantavion-live-20260923-v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pantavion-live-release-v2
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify provider-neutral runtime contract
        run: node --no-warnings --experimental-strip-types scripts/pantavion-provider-neutral-runtime-audit.mjs

      - name: Verify Cyprus GIS source federation
        run: node --no-warnings --experimental-strip-types scripts/pantavion-water-cyprus-sources-audit.mjs

      - name: Verify protected Water runtime lock
        run: npm run audit:water:network-lock

      - name: Execute private segment reader regression
        run: node --experimental-strip-types scripts/water-segment-reader-regression.mjs

      - name: TypeScript verification
        run: npm run typecheck

      - name: Production build
        run: npm run build
