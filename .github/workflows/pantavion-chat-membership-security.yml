name: Pantavion Chat Membership RLS Truth

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chat-boundary:
    name: Verify membership-only message access and no-session test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Chat private participant protection
        run: node tests/pantavion-chat-membership-security.test.mjs
