name: Pantavion Direct OpenAI Production Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/pantavion-direct-openai-production-diagnostic.yml'
      - 'core/translation/pantavion-direct-openai-translation.ts'
      - 'core/translation/pantavion-translation-provider-adapters.ts'
      - 'app/api/pantavion/translate/route.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-direct-openai:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe existing production direct OpenAI route safely
        env:
          PANTAVION_PRODUCTION_BASE: https://pantavion.com
        run: |
          set -euo pipefail
          code=$(curl --location --silent --show-error --max-time 30 \
            -o /tmp/panta-ai.json -w "%{http_code}" \
            -X POST "$PANTAVION_PRODUCTION_BASE/api/pantavion/ai" \
            -H 'Content-Type: application/json' \
            --data '{"assistantKey":"publicGuide","message":"Return exactly the single word READY."}' || true)

          echo "PantaAI HTTP=$code"
          jq '{
            ok: (.ok // false),
            error: (.error // null),
            upstreamStatus: (.status // null),
            provider: (.provider // null),
            model: (.model // null),
            upstreamErrorType: (.providerResponse.error.type // null),
            upstreamErrorCode: (.providerResponse.error.code // null),
            upstreamErrorParam: (.providerResponse.error.param // null)
          }' /tmp/panta-ai.json || true

          if [ "$code" = "200" ]; then
            echo "DIRECT_OPENAI_PRODUCTION_ROUTE=SUCCESS"
          else
            echo "DIRECT_OPENAI_PRODUCTION_ROUTE=FAILED"
          fi
