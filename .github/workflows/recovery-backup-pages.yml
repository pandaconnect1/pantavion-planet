name: Deploy Pantavion Recovery Backup

on:
  push:
    branches: ["main"]
    paths:
      - "docs/recovery-backup/**"
      - ".github/workflows/recovery-backup-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pantavion-recovery-backup-pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload recovery backup site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/recovery-backup

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
