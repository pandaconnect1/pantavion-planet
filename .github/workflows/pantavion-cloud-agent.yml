name: Pantavion Cloud Agent

on:
  workflow_dispatch:
    inputs:
      spec_base64:
        description: "Base64 JSON agent request"
        required: false
      issue_number:
        description: "Optional GitHub issue number"
        required: false
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  pantavion-cloud-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Pantavion Cloud Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
          SPEC_BASE64: ${{ github.event.inputs.spec_base64 }}
        run: node scripts/pantavion-cloud-agent.cjs
