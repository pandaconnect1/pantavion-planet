name: Pantavion Water Blob Recovery Inventory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pantavion-water-blob-recovery-inventory.yml'

permissions:
  contents: read

concurrency:
  group: pantavion-water-blob-recovery-inventory
  cancel-in-progress: false

jobs:
  inventory:
    name: Inventory private Water DWG blobs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_CLI_VERSION: '59.5.0'

    steps:
      - name: Require authorized Vercel credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and Vercel CLI
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm install --global "vercel@$VERCEL_CLI_VERSION" --no-audit --no-fund

      - name: Pull production environment and inventory Water blobs
        shell: bash
        run: |
          set -euo pipefail
          env_file="$RUNNER_TEMP/pantavion-vercel-production.env"
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN" >/dev/null
          vercel env pull "$env_file" --environment=production --token="$VERCEL_TOKEN" >/dev/null

          blob_token=$(node - "$env_file" <<'NODE'
          const fs = require("fs");
          const file = process.argv[2];
          const text = fs.readFileSync(file, "utf8");
          const lines = text.split(/\r?\n/);
          for (const name of ["BLOB_READ_WRITE_TOKEN","PANTAVION_BLOB_READ_WRITE_TOKEN"]) {
            const line = lines.find((x) => x.startsWith(name + "="));
            if (!line) continue;
            let value = line.slice(name.length + 1).trim();
            if ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'"))) {
              value = value.slice(1, -1);
            }
            if (value) { process.stdout.write(value); process.exit(0); }
          }
          process.exit(2);
          NODE
          )