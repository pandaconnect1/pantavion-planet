name: Pantavion Generate Fencing Migration Name

on:
  push:
    branches:
      - feature/durable-execution-fencing-contract-20260828
    paths:
      - ".github/workflows/pantavion-generate-fencing-migration-name.yml"

permissions:
  contents: read

jobs:
  generate-name:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate migration name with Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.115.0 migration new durable_execution_lease_fencing
          migration="$(find supabase/migrations -maxdepth 1 -type f -name '*_durable_execution_lease_fencing.sql' -printf '%f\n' | sort | tail -n 1)"
          test -n "$migration"
          printf 'GENERATED_MIGRATION=%s\n' "$migration"
