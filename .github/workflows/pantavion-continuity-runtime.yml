name: pantavion-continuity-runtime

on:
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * *"

jobs:
  continuity-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pantavion
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Run Pantavion continuity gate
        run: npm run audit:continuity-runtime

      - name: Generate market radar report
        run: npm run radar:report

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
