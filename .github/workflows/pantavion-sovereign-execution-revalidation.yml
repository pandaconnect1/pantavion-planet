name: Pantavion Sovereign Execution Revalidation

on:
  pull_request:
    branches:
      - feat/sovereign-admission-bundle-20260910
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-execution-revalidation:
    name: Verify fail-closed pre-execution revalidation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact head and parent evidence
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git cat-file -e 34ef8f01c0ae53412a4b07ae93f8a13c711c2a16^{commit}
          test "$(git merge-base HEAD 34ef8f01c0ae53412a4b07ae93f8a13c711c2a16)" = "34ef8f01c0ae53412a4b07ae93f8a13c711c2a16"
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify parent admission bundle
        run: npm run test:sovereign-admission-bundle
      - name: Verify execution revalidation contract
        run: npm run test:sovereign-execution-revalidation
      - name: Verify owner release boundary
        run: npm run test:owner-release-gate
      - name: Verify recovery truth boundary
        run: npm run test:recovery-runtime-fabric
      - name: Verify Guardian security boundary
        run: node scripts/pantavion-runtime-safety-gate.cjs
      - name: TypeScript verification
        run: npm run typecheck
      - name: Production build verification
        run: npm run build
