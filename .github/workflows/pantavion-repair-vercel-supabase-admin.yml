name: Pantavion Repair Vercel Supabase Admin

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pantavion-repair-vercel-supabase-admin.yml'

permissions:
  contents: read

concurrency:
  group: pantavion-repair-vercel-supabase-admin
  cancel-in-progress: false

jobs:
  repair-production-admin-binding:
    name: Restore production Supabase admin binding
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      PANTAVION_PRODUCTION_BASE: https://pantavion.com
      VERCEL_CLI_VERSION: '59.5.0'

    steps:
      - name: Require authorized platform credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured; production admin binding repair is blocked."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          if [ "$SUPABASE_PROJECT_REF" != "cxhulvwkagzufbjsdwwu" ]; then
            echo "::error::SUPABASE_PROJECT_REF does not match the canonical Pantavion production project."
            exit 1
          fi

      - name: Checkout exact main revision
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Resolve elevated Supabase API key without logging it
        id: supabase-key
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/pantavion-supabase-admin-key"
          json_file="$RUNNER_TEMP/pantavion-supabase-api-keys.json"
          umask 077
          supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" --output json > "$json_file"
          jq -r '[.[] | select((.type == "secret") or (.name == "service_role")) | .api_key][0] // empty' "$json_file" > "$key_file"
          rm -f "$json_file"
          key=$(cat "$key_file")
          if [ ${#key} -lt 32 ]; then
            echo "::error::No elevated Supabase secret/service_role API key was returned by the authorized Management API."
            rm -f "$key_file"
            exit 1
          fi
          echo "::add-mask::$key"
          echo "key_file=$key_file" >> "$GITHUB_OUTPUT"

      - name: Install and link Vercel CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "vercel@$VERCEL_CLI_VERSION" --no-audit --no-fund
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Restore sensitive production admin key
        shell: bash
        env:
          KEY_FILE: ${{ steps.supabase-key.outputs.key_file }}
        run: |
          set -euo pipefail
          if [ ! -s "$KEY_FILE" ]; then
            echo "::error::Supabase admin key handoff file is missing."
            exit 1
          fi
          if vercel env update SUPABASE_SECRET_KEY production --token="$VERCEL_TOKEN" < "$KEY_FILE"; then
            echo "Updated existing sensitive SUPABASE_SECRET_KEY binding."
          else
            vercel env add SUPABASE_SECRET_KEY production --sensitive --token="$VERCEL_TOKEN" < "$KEY_FILE"
            echo "Added sensitive SUPABASE_SECRET_KEY binding."
          fi
          rm -f "$KEY_FILE"

      - name: Rebuild and redeploy exact main with repaired binding
        shell: bash
        run: |
          set -euo pipefail
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Verify exact production revision and admin health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            social_code=$(curl -sS -L --connect-timeout 10 --max-time 20 -o /tmp/social-health.json -w "%{http_code}" "$PANTAVION_PRODUCTION_BASE/api/social/health" || true)
            revision=$(jq -r '.revision // empty' /tmp/social-health.json 2>/dev/null || true)
            if [ "$social_code" = "200" ] && [ "$revision" = "$GITHUB_SHA" ]; then
              scheduler_code=$(curl -sS -L --connect-timeout 10 --max-time 30 -o /tmp/scheduler-health.json -w "%{http_code}" "$PANTAVION_PRODUCTION_BASE/api/pantavion/intelligence/scheduler-health" || true)
              scheduler_revision=$(jq -r '.revision // empty' /tmp/scheduler-health.json 2>/dev/null || true)
              if [ "$scheduler_code" = "200" ] && [ "$scheduler_revision" = "$GITHUB_SHA" ]; then
                echo "Exact production revision has working Supabase admin health."
                exit 0
              fi
            fi
            sleep 15
          done
          echo "::error::Production did not expose working scheduler admin health on exact revision $GITHUB_SHA."
          cat /tmp/scheduler-health.json 2>/dev/null || true
          exit 1
