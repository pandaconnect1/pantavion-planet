name: DIAG Map B derived

on:
  push:
    branches: [diag/water-map-b-derived]

permissions:
  contents: read

concurrency:
  group: diag-water-map-b-derived
  cancel-in-progress: false

jobs:
  derive-authentic-water-maps:
    name: Build missing protected Map B / Map C derived tiles
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Require canonical Supabase management binding
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "::error::SUPABASE_ACCESS_TOKEN missing"; exit 1; }
          test -n "${SUPABASE_PROJECT_REF:-}" || { echo "::error::SUPABASE_PROJECT_REF missing"; exit 1; }
          test "$SUPABASE_PROJECT_REF" = "cxhulvwkagzufbjsdwwu" || {
            echo "::error::SUPABASE_PROJECT_REF does not match canonical Pantavion production project."
            exit 1
          }

      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify approved founder-selected DWG is exact and access-controlled
        run: node scripts/water-approved-owner-dwg-regression.mjs

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Resolve elevated Supabase key without logging it
        id: supabase-key
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/pantavion-water-derived-supabase-key"
          json_file="$RUNNER_TEMP/pantavion-water-derived-api-keys.json"
          umask 077
          supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" --output json > "$json_file"
          jq -r '[.[] | select((.type == "secret") or (.name == "service_role")) | .api_key][0] // empty' "$json_file" > "$key_file"
          rm -f "$json_file"
          key=$(cat "$key_file")
          if [ ${#key} -lt 32 ]; then
            echo "::error::No elevated Supabase key available through authorized Management API."
            rm -f "$key_file"
            exit 1
          fi
          echo "::add-mask::$key"
          echo "key_file=$key_file" >> "$GITHUB_OUTPUT"

      - name: Probe native tools
        run: |
          apt-cache policy libredwg-tools libredwg-utils 2>&1 | head -20 > probe.txt || true
          free -m >> probe.txt; nproc >> probe.txt
          node -e "const p=require('./node_modules/@mlightcad/libredwg-web/package.json');console.log('libredwg-web',p.version)" >> probe.txt
          msg=$(sed 's/%/%25/g' probe.txt | sed ':a;N;$!ba;s/\n/%0A/g'); echo "::notice title=probe::$msg"

      - name: Dry-run fixed Map B derivation (no upload)
        shell: bash
        env:
          KEY_FILE: ${{ steps.supabase-key.outputs.key_file }}
        run: |
          set +e
          export SUPABASE_SECRET_KEY="$(cat "$KEY_FILE")"
          export SUPABASE_URL="https://cxhulvwkagzufbjsdwwu.supabase.co"
          export PANTAVION_WATER_MAP_B_SOURCE_KEY=canonical-2026-andreaspap
          export PANTAVION_WATER_MAP_B_DERIVED_OUT="$RUNNER_TEMP/mapb"
          export NODE_OPTIONS="--stack-trace-limit=40 --max-old-space-size=12288"
          code=0
          /usr/bin/time -v node scripts/pantavion-water-map-b-generate-derived.mjs > out.log 2>&1 || code=$?
          rm -f "$KEY_FILE"
          {
            echo "exit=$code"
            grep -E "Maximum resident|Elapsed" out.log
            tail -c 3000 out.log | grep -v "Command being\|kbytes\|page faults\|context switches\|Swaps\|File system\|Socket\|Signals\|Page size\|Percent of\|User time\|System time"
            if [ -f "$RUNNER_TEMP/mapb/manifest.json" ]; then
              jq -c '{grid,totalEntities,totalLineSegments,pointCount,labelCount,writtenTileCount,densestTileSegments,outsideCoreEntityCount,allBounds,coreBounds,layerCount:(.layers|length),topLayers:(.topLayers[:12]),coverage:(.coverage|{entityTypeCounts,unsupportedTypeCounts,unsupportedCount,blockInsertCount,expandedBlockEntityCount})}' "$RUNNER_TEMP/mapb/manifest.json"
              echo "tiles_dir_size=$(du -sh $RUNNER_TEMP/mapb/tiles | cut -f1) files=$(ls $RUNNER_TEMP/mapb/tiles | wc -l)"
              echo "largest_tiles:"; ls -S -l $RUNNER_TEMP/mapb/tiles | head -4 | awk '{print $5, $9}'
            fi
          } > tail.txt
          msg=$(grep -v -i "secret\|eyJ" tail.txt | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=diag-map-b::$msg"
          exit 0
