name: Pantavion Private Credential Sync Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/pantavion-private-credential-sync-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-private-credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_PANTAVION_OPENAI_API_KEY: ${{ secrets.PANTAVION_OPENAI_API_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Report secret presence without values
        run: |
          set -euo pipefail
          for name in GH_OPENAI_API_KEY GH_PANTAVION_OPENAI_API_KEY VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -n "${!name}" ]; then
              echo "$name=PRESENT"
            else
              echo "$name=MISSING"
            fi
          done

      - name: Validate GitHub OpenAI secrets without exposing values
        run: |
          set -euo pipefail
          probe_key() {
            label="$1"
            key="$2"
            if [ -z "$key" ]; then
              echo "$label=MISSING"
              return 0
            fi

            code=$(curl --silent --show-error --max-time 20 \
              -o "/tmp/${label}.json" -w "%{http_code}" \
              -X POST https://api.openai.com/v1/responses \
              -H "Authorization: Bearer $key" \
              -H 'Content-Type: application/json' \
              --data '{"model":"gpt-4o-mini","input":"Return exactly READY."}' || true)

            err_type=$(jq -r '.error.type // empty' "/tmp/${label}.json" 2>/dev/null || true)
            err_code=$(jq -r '.error.code // empty' "/tmp/${label}.json" 2>/dev/null || true)
            echo "$label HTTP=$code errorType=${err_type:-none} errorCode=${err_code:-none}"
          }

          probe_key GH_OPENAI_API_KEY "$GH_OPENAI_API_KEY"
          probe_key GH_PANTAVION_OPENAI_API_KEY "$GH_PANTAVION_OPENAI_API_KEY"
