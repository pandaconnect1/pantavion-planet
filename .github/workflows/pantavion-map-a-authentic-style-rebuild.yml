name: Pantavion Map A Authentic Style Rebuild

on:
  push:
    branches:
      - water/map-a-authentic-styles-20260925
    paths:
      - 'scripts/water-rebuild-authentic-kml-styles.cjs'
      - '.github/workflows/pantavion-map-a-authentic-style-rebuild.yml'

permissions:
  contents: read

concurrency:
  group: pantavion-map-a-authentic-style-rebuild
  cancel-in-progress: true

jobs:
  rebuild-authentic-styles:
    name: Rebuild original KMZ styles only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Require canonical Supabase credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          fi
          if [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::error::SUPABASE_PROJECT_REF is not configured."
            exit 1
          fi
          if [ "$SUPABASE_PROJECT_REF" != "cxhulvwkagzufbjsdwwu" ]; then
            echo "::error::Unexpected Supabase project ref."
            exit 1
          fi

      - name: Checkout isolated rebuild branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Ensure unzip and jq are available
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y unzip jq >/dev/null

      - name: Resolve elevated Supabase API key without logging it
        id: supabase-key
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/pantavion-map-a-supabase-admin-key"
          json_file="$RUNNER_TEMP/pantavion-map-a-supabase-api-keys.json"
          umask 077
          supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" --output json > "$json_file"
          jq -r '[.[] | select((.type == "secret") or (.name == "service_role")) | .api_key][0] // empty' "$json_file" > "$key_file"
          rm -f "$json_file"
          key=$(cat "$key_file")
          if [ ${#key} -lt 32 ]; then
            echo "::error::No elevated Supabase API key was returned."
            rm -f "$key_file"
            exit 1
          fi
          echo "::add-mask::$key"
          echo "key_file=$key_file" >> "$GITHUB_OUTPUT"

      - name: Rebuild authentic KMZ style metadata
        shell: bash
        env:
          SUPABASE_KEY_FILE: ${{ steps.supabase-key.outputs.key_file }}
          SUPABASE_URL: https://cxhulvwkagzufbjsdwwu.supabase.co
        run: |
          set -euo pipefail
          node scripts/water-rebuild-authentic-kml-styles.cjs | tee "$RUNNER_TEMP/map-a-style-rebuild-result.json"

      - name: Remove temporary admin key
        if: always()
        shell: bash
        env:
          SUPABASE_KEY_FILE: ${{ steps.supabase-key.outputs.key_file }}
        run: |
          rm -f "${SUPABASE_KEY_FILE:-}"

      - name: Record non-secret summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Map A authentic style rebuild"
            echo
            echo "- Source geometry modified: **NO**"
            echo "- Coordinates modified: **NO**"
            echo "- Layers filtered: **NO**"
            echo "- Original KML styles extracted from verified private KMZ: **YES**"
          } >> "$GITHUB_STEP_SUMMARY"
