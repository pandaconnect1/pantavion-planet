name: Pantavion Semantic Classification v3

on:
  pull_request:
    paths:
      - "scripts/pantavion-canonical-semantic-classification-v3.cjs"
      - ".github/workflows/pantavion-semantic-classification-v3.yml"
      - "data/recovery/imported-pr248/**"
      - "data/recovery/production-truth/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pantavion-semantic-classification-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-classification:
    name: Preserve and classify all 82,413 records
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run fail-closed semantic classification
        run: node scripts/pantavion-canonical-semantic-classification-v3.cjs
      - name: Verify preservation and truth boundary
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const corpusRoot = "data/recovery/imported-pr248/canonical-ledger/corpus";
          const receipt = JSON.parse(fs.readFileSync(path.join(corpusRoot,"MATERIALIZATION_RECEIPT.json"),"utf8"));
          const source = fs.readdirSync(path.join(corpusRoot,"batches")).filter(x=>x.endsWith(".json")).sort().flatMap(name=>JSON.parse(fs.readFileSync(path.join(corpusRoot,"batches",name),"utf8")).records);
          const readline = require("readline");
          const manifest = JSON.parse(fs.readFileSync("data/recovery/canonical-semantic-v3/manifest.json","utf8"));
          const productionTruth = JSON.parse(fs.readFileSync("data/recovery/production-truth/supabase-repository-evidence-20260826.json","utf8"));
          const repoMigrations = productionTruth.repository.migrationFiles;
          const appliedMigrations = productionTruth.supabase.appliedMigrations;
          if (repoMigrations.count !== repoMigrations.items.length || appliedMigrations.count !== appliedMigrations.items.length) throw new Error("Production truth migration count mismatch");
          const appliedNames = new Set(appliedMigrations.items.map(item=>item.name));
          const exactMatches = repoMigrations.items.filter(item=>appliedNames.has(item.file.replace(/^\d+_/,"").replace(/\.sql$/,""))).length;
          if (exactMatches !== productionTruth.reconciliation.exactMigrationNameMatches) throw new Error("Migration reconciliation exact-match mismatch");
          if (productionTruth.reconciliation.decision !== "HOLD_NON_EXACT") throw new Error("Non-exact migrations must remain HOLD");
          const objectEvidence = productionTruth.reconciliation.objectLevelProductionEvidence;
          if (!objectEvidence || objectEvidence.examinedRepositoryMigrations !== 20 || objectEvidence.items.length !== 20) throw new Error("Object-level reconciliation must cover all 20 non-exact repository migrations");
          if (objectEvidence.equivalenceDecision !== "HOLD_NON_EXACT" || objectEvidence.items.some(item => item.equivalenceDecision !== "HOLD_NON_EXACT")) throw new Error("Object presence must not be promoted to migration equivalence");
          const objectStatusTotal = Object.values(objectEvidence.statusCounts).reduce((sum,count) => sum + count,0);
          if (objectStatusTotal !== 20) throw new Error("Object-level reconciliation status accounting mismatch");
          const expectedObjectStatuses = { SCHEMA_OBJECTS_ALL_PRESENT:5, SCHEMA_OBJECTS_PARTIAL:3, SCHEMA_OBJECTS_NOT_OBSERVED:10, OBSERVABLE_EFFECTS_ALL_PRESENT:1, OBSERVABLE_EFFECTS_PARTIAL:1 };
          for (const [status,count] of Object.entries(expectedObjectStatuses)) if (objectEvidence.statusCounts[status] !== count) throw new Error("Unexpected object-level status "+status+": "+objectEvidence.statusCounts[status]);
          const definitionLineage = objectEvidence.definitionLineage;
          if (!definitionLineage || definitionLineage.repositoryMigrationsExamined !== 8 || definitionLineage.items.length !== 8 || definitionLineage.appliedMigrationHistoryRows !== 56) throw new Error("Definition lineage must cover 8 repository migrations and all 56 applied migrations");
          if (definitionLineage.declaredFunctions !== 23 || definitionLineage.currentLiveFunctions !== 13 || definitionLineage.missingFunctions !== 10) throw new Error("Definition lineage function accounting mismatch");
          if (definitionLineage.currentLiveFunctionsMatchingLatestAppliedDefinition !== 13 || definitionLineage.repositoryFunctionsMatchingCurrentLiveDefinition !== 3 || definitionLineage.repositoryFunctionsDifferingFromCurrentLiveDefinition !== 10) throw new Error("Definition lineage comparison mismatch");
          if (definitionLineage.declaredRelations !== 19 || definitionLineage.currentLiveRelations !== 18 || definitionLineage.missingRelations !== 1 || definitionLineage.currentLiveRelationsWithAppliedCreateLineage !== 18) throw new Error("Definition lineage relation accounting mismatch");
          if (definitionLineage.statusCounts.CURRENT_PRODUCTION_LINEAGE_CONFIRMED !== 5 || definitionLineage.statusCounts.PARTIAL_CURRENT_PRODUCTION_LINEAGE !== 3) throw new Error("Definition lineage migration status mismatch");
          if (definitionLineage.equivalenceDecision !== "HOLD_NON_EXACT") throw new Error("Definition lineage must remain HOLD_NON_EXACT");
          if (!productionTruth.supabase.publicTables.allRlsEnabled) throw new Error("Production truth reports a public table without RLS");
          if (productionTruth.supabase.registrationGate.publicRegistrationEnabled) throw new Error("Public registration truth gate unexpectedly enabled");
          if (!manifest.externalProductionTruth || manifest.externalProductionTruth.repositoryMigrationFiles !== repoMigrations.count || manifest.externalProductionTruth.appliedMigrations !== appliedMigrations.count) throw new Error("Manifest omitted repository/Supabase truth evidence");
          if (!manifest.externalProductionTruth.objectLevelMigrationEvidence || manifest.externalProductionTruth.objectLevelMigrationEvidence.examinedRepositoryMigrations !== 20 || manifest.externalProductionTruth.objectLevelMigrationEvidence.equivalenceDecision !== "HOLD_NON_EXACT") throw new Error("Manifest omitted object-level migration truth evidence");
          const manifestLineage = manifest.externalProductionTruth.objectLevelMigrationEvidence.definitionLineage;
          if (!manifestLineage || manifestLineage.repositoryMigrationsExamined !== 8 || manifestLineage.currentLiveFunctionsMatchingLatestAppliedDefinition !== 13 || manifestLineage.currentLiveRelations !== 18 || manifestLineage.equivalenceDecision !== "HOLD_NON_EXACT") throw new Error("Manifest omitted definition lineage evidence");
          if (receipt.totalRecords !== 82413 || source.length !== 82413) throw new Error("82,413-record source preservation mismatch");
          if (manifest.sourceFingerprint !== receipt.corpusFingerprint || manifest.recordCount !== 82413 || manifest.preservedRecordCount !== 82413) throw new Error("Manifest/receipt mismatch");
          (async () => {
            const input = fs.createReadStream("data/recovery/canonical-semantic-v3/semantic-ledger.ndjson",{encoding:"utf8"});
            const lines = readline.createInterface({input,crlfDelay:Infinity});
            let index = 0;
            let falselyFinal = 0;
            let recursiveArtifacts = 0;
            let pathAnchored = 0;
            let pathReassigned = 0;
            let pathAnchorMismatches = 0;
            let artifactTypeMismatches = 0;
            let moduleMissingResolved = 0;
            let remainingModuleMissing = 0;
            let capabilityConflicts = 0;
            let capabilityPathEvidence = 0;
            let capabilityPathMismatches = 0;
            let runtimeReports = 0;
            let runtimeReportMismatches = 0;
            for await (const line of lines) {
              if (!line.trim()) continue;
              if (index >= source.length) throw new Error("Semantic ledger contains extra records");
              const record = JSON.parse(line);
              if (source[index].id !== record.id) throw new Error("Record ID/order changed at "+index);
              if (JSON.stringify(source[index].provenance) !== JSON.stringify(record.provenance)) throw new Error("Provenance changed at "+index);
              if (record.reviewStatus==="SEMANTICALLY_CLASSIFIED"&&(!record.classification.subsystem||!record.classification.capability||!record.classification.feature||!record.classification.canonicalTarget)) falselyFinal++;
              const evidence = record.classification && record.classification.classificationEvidence;
              const anchor = evidence && evidence.pathAnchor;
              if (String(record.provenance && record.provenance.sourceFile || "").startsWith("data/runtime-reports/")) {
                runtimeReports++;
                if (record.classification.module !== "Recovery / Provenance" || record.classification.subsystem !== "evidence" || record.classification.capability !== "observe" || record.classification.artifactType !== "runtime-evidence" || record.reviewStatus !== "SEMANTICALLY_CLASSIFIED") runtimeReportMismatches++;
              }
              if (anchor) {
                pathAnchored++;
                if (record.classification.module !== anchor.module || record.classification.subsystem !== anchor.subsystem) pathAnchorMismatches++;
                if (evidence.seedModule !== record.classification.module) pathReassigned++;
                if (record.reviewStatus !== "PRESERVED_RECURSIVE_ARTIFACT" && !evidence.seedModule && record.classification.module) moduleMissingResolved++;
              }
              if (record.reviewStatus !== "PRESERVED_RECURSIVE_ARTIFACT" && (record.semanticReviewReasons || []).includes("module_missing")) remainingModuleMissing++;
              if ((record.semanticReviewReasons || []).includes("capability_conflict")) capabilityConflicts++;
              const capabilityPath = evidence && evidence.capabilityPath;
              if (capabilityPath) {
                capabilityPathEvidence++;
                const rankedCapability = evidence.capability && evidence.capability[0] && evidence.capability[0].name;
                if (record.classification.capability !== capabilityPath.capability || rankedCapability !== capabilityPath.capability || capabilityPath.sourcePath !== String(record.provenance && record.provenance.sourceFile || "")) capabilityPathMismatches++;
              }
              const sourceFile = String(record.provenance && record.provenance.sourceFile || "");
              if (sourceFile.startsWith(".github/") && record.classification.artifactType !== "automation") artifactTypeMismatches++;
              if (sourceFile.startsWith("data/runtime-reports/") && record.classification.artifactType !== "runtime-evidence") artifactTypeMismatches++;
              const recursiveSource = String(record.provenance && record.provenance.sourceFile || "").startsWith("data/recovery/canonical-ledger/corpus/batches/");
              if (record.reviewStatus==="PRESERVED_RECURSIVE_ARTIFACT") {
                if (!recursiveSource || record.semanticDecision!=="PRESERVE_QUARANTINE") throw new Error("Invalid recursive artifact disposition at "+index);
                recursiveArtifacts++;
              } else if (recursiveSource) throw new Error("Recursive ledger artifact escaped quarantine at "+index);
              index++;
            }
            if (index !== 82413) throw new Error("Semantic ledger record count mismatch: "+index);
            if (falselyFinal) throw new Error("Found falsely classified records: "+falselyFinal);
            if (recursiveArtifacts !== 50279 || manifest.completion.preservedRecursiveArtifacts !== 50279) throw new Error("Recursive artifact quarantine mismatch: "+recursiveArtifacts);
            if (!pathAnchored || pathAnchorMismatches) throw new Error("Source-path anchor regression: anchored="+pathAnchored+", mismatches="+pathAnchorMismatches);
            if (artifactTypeMismatches) throw new Error("Artifact-type path regression: "+artifactTypeMismatches);
            if (remainingModuleMissing !== 0) throw new Error("Unresolved module_missing records remain: "+remainingModuleMissing);
            if (moduleMissingResolved !== 1288) throw new Error("Module-missing resolution accounting mismatch: "+moduleMissingResolved);
            const manifestModuleMissingResolved = Object.values(manifest.moduleSummary).reduce((sum,item) => sum + (item.moduleMissingResolved || 0),0);
            if (manifest.moduleMissingResolved !== moduleMissingResolved || manifestModuleMissingResolved !== moduleMissingResolved) throw new Error("Manifest module-missing accounting mismatch");
            if (capabilityConflicts !== 1807 || manifest.reviewReasonSummary.capability_conflict !== capabilityConflicts) throw new Error("Capability-conflict wave accounting mismatch: "+capabilityConflicts);
            if (manifest.reviewReasonSummary.capability_missing !== 882) throw new Error("Capability-missing wave accounting mismatch: "+manifest.reviewReasonSummary.capability_missing);
            if (manifest.completion.semanticallyClassified !== 28107 || manifest.completion.reviewRequired !== 4027) throw new Error("Strict-ownership completion accounting mismatch");
            if (runtimeReports !== 2003 || runtimeReportMismatches) throw new Error("Runtime-report provenance routing mismatch: reports="+runtimeReports+", mismatches="+runtimeReportMismatches);
            if (!capabilityPathEvidence || capabilityPathMismatches) throw new Error("Capability-path evidence regression: evidence="+capabilityPathEvidence+", mismatches="+capabilityPathMismatches);
            const manifestAnchored = Object.values(manifest.moduleSummary).reduce((sum,item) => sum + (item.pathAnchored || 0),0);
            const manifestReassigned = Object.values(manifest.moduleSummary).reduce((sum,item) => sum + (item.pathReassigned || 0),0);
            if (manifestAnchored !== pathAnchored || manifestReassigned !== pathReassigned) throw new Error("Path-anchor manifest accounting mismatch");
            const criticalModules = ['Identity / Auth / Consent','Safety / Trust / Minors','Kernel / Guardian / Runtime','People','Social / Pulse / Communities','Chat','Interpreter / Translation'];
            for (const module of criticalModules) {
              const gap = manifest.moduleSummary[module];
              if (!gap || !gap.externalEvidence || !gap.externalEvidence.repositoryMigrationFiles.length || !gap.externalEvidence.appliedMigrations.length) throw new Error("Missing external migration evidence for "+module);
              if (!productionTruth.repository.verificationArtifacts.conventionalTests.count && !gap.missingCombinedEvidenceCategories.includes("tests")) throw new Error("Gates/audits were incorrectly treated as conventional tests for "+module);
            }
            console.log(JSON.stringify({ ...manifest.completion, pathAnchored, pathReassigned, moduleMissingResolved, remainingModuleMissing, capabilityConflicts, capabilityPathEvidence, externalProductionTruth:manifest.externalProductionTruth }));
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Upload semantic ledger and module gap map
        uses: actions/upload-artifact@v4
        with:
          name: pantavion-semantic-classification-v3
          path: data/recovery/canonical-semantic-v3/
          retention-days: 30
