name: Pantavion Semantic Classification v3

on:
  pull_request:
    paths:
      - "scripts/pantavion-canonical-semantic-classification-v3.cjs"
      - ".github/workflows/pantavion-semantic-classification-v3.yml"
      - "data/recovery/imported-pr248/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pantavion-semantic-classification-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-classification:
    name: Preserve and classify all 82,413 records
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run fail-closed semantic classification
        run: node scripts/pantavion-canonical-semantic-classification-v3.cjs
      - name: Verify preservation and truth boundary
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const corpusRoot = "data/recovery/imported-pr248/canonical-ledger/corpus";
          const receipt = JSON.parse(fs.readFileSync(path.join(corpusRoot,"MATERIALIZATION_RECEIPT.json"),"utf8"));
          const source = fs.readdirSync(path.join(corpusRoot,"batches")).filter(x=>x.endsWith(".json")).sort().flatMap(name=>JSON.parse(fs.readFileSync(path.join(corpusRoot,"batches",name),"utf8")).records);
          const output = JSON.parse(fs.readFileSync("data/recovery/canonical-semantic-v3/semantic-ledger.json","utf8"));
          const manifest = output.manifest;
          if (receipt.totalRecords !== 82413 || source.length !== 82413 || output.records.length !== 82413) throw new Error("82,413-record preservation mismatch");
          for (let i=0;i<source.length;i++) {
            if (source[i].id !== output.records[i].id) throw new Error("Record ID/order changed at "+i);
            if (JSON.stringify(source[i].provenance) !== JSON.stringify(output.records[i].provenance)) throw new Error("Provenance changed at "+i);
          }
          if (manifest.sourceFingerprint !== receipt.corpusFingerprint || manifest.recordCount !== 82413 || manifest.preservedRecordCount !== 82413) throw new Error("Manifest/receipt mismatch");
          const falselyFinal=output.records.filter(r=>r.reviewStatus==="SEMANTICALLY_CLASSIFIED"&&(!r.classification.subsystem||!r.classification.capability||!r.classification.feature||!r.classification.canonicalTarget));
          if (falselyFinal.length) throw new Error("Found falsely classified records: "+falselyFinal.length);
          console.log(JSON.stringify(manifest.completion));
          NODE
      - name: Upload semantic ledger and module gap map
        uses: actions/upload-artifact@v4
        with:
          name: pantavion-semantic-classification-v3
          path: data/recovery/canonical-semantic-v3/
          retention-days: 30
