name: Pantavion Semantic Classification v3

on:
  pull_request:
    paths:
      - "scripts/pantavion-canonical-semantic-classification-v3.cjs"
      - ".github/workflows/pantavion-semantic-classification-v3.yml"
      - "data/recovery/imported-pr248/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pantavion-semantic-classification-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-classification:
    name: Preserve and classify all 82,413 records
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run fail-closed semantic classification
        run: node scripts/pantavion-canonical-semantic-classification-v3.cjs
      - name: Verify preservation and truth boundary
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const corpusRoot = "data/recovery/imported-pr248/canonical-ledger/corpus";
          const receipt = JSON.parse(fs.readFileSync(path.join(corpusRoot,"MATERIALIZATION_RECEIPT.json"),"utf8"));
          const source = fs.readdirSync(path.join(corpusRoot,"batches")).filter(x=>x.endsWith(".json")).sort().flatMap(name=>JSON.parse(fs.readFileSync(path.join(corpusRoot,"batches",name),"utf8")).records);
          const readline = require("readline");
          const manifest = JSON.parse(fs.readFileSync("data/recovery/canonical-semantic-v3/manifest.json","utf8"));
          if (receipt.totalRecords !== 82413 || source.length !== 82413) throw new Error("82,413-record source preservation mismatch");
          if (manifest.sourceFingerprint !== receipt.corpusFingerprint || manifest.recordCount !== 82413 || manifest.preservedRecordCount !== 82413) throw new Error("Manifest/receipt mismatch");
          (async () => {
            const input = fs.createReadStream("data/recovery/canonical-semantic-v3/semantic-ledger.ndjson",{encoding:"utf8"});
            const lines = readline.createInterface({input,crlfDelay:Infinity});
            let index = 0;
            let falselyFinal = 0;
            let recursiveArtifacts = 0;
            for await (const line of lines) {
              if (!line.trim()) continue;
              if (index >= source.length) throw new Error("Semantic ledger contains extra records");
              const record = JSON.parse(line);
              if (source[index].id !== record.id) throw new Error("Record ID/order changed at "+index);
              if (JSON.stringify(source[index].provenance) !== JSON.stringify(record.provenance)) throw new Error("Provenance changed at "+index);
              if (record.reviewStatus==="SEMANTICALLY_CLASSIFIED"&&(!record.classification.subsystem||!record.classification.capability||!record.classification.feature||!record.classification.canonicalTarget)) falselyFinal++;
              const recursiveSource = String(record.provenance && record.provenance.sourceFile || "").startsWith("data/recovery/canonical-ledger/corpus/batches/");
              if (record.reviewStatus==="PRESERVED_RECURSIVE_ARTIFACT") {
                if (!recursiveSource || record.semanticDecision!=="PRESERVE_QUARANTINE") throw new Error("Invalid recursive artifact disposition at "+index);
                recursiveArtifacts++;
              } else if (recursiveSource) throw new Error("Recursive ledger artifact escaped quarantine at "+index);
              index++;
            }
            if (index !== 82413) throw new Error("Semantic ledger record count mismatch: "+index);
            if (falselyFinal) throw new Error("Found falsely classified records: "+falselyFinal);
            if (recursiveArtifacts !== 50279 || manifest.completion.preservedRecursiveArtifacts !== 50279) throw new Error("Recursive artifact quarantine mismatch: "+recursiveArtifacts);
            console.log(JSON.stringify(manifest.completion));
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Upload semantic ledger and module gap map
        uses: actions/upload-artifact@v4
        with:
          name: pantavion-semantic-classification-v3
          path: data/recovery/canonical-semantic-v3/
          retention-days: 30
